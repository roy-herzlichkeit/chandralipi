# Default pipeline configuration.
# Values here are the validated defaults; override per experiment rather than
# editing this file, so benchmark runs stay comparable.

preprocess:
  # Makharia et al. (arXiv:2509.04775) found CLAHE the strongest single step
  # under extreme illumination variation. Disabling it is an experiment, not a
  # tuning choice -- say so in the run notes if you do.
  clahe: true
  clahe_clip_limit: 2.0
  clahe_grid: [8, 8]
  suppress_shadow: true
  shadow_percentile: 5.0

match:
  matcher: loftr          # loftr | lightglue | sift | akaze | orb
  weights: outdoor        # 'indoor' is trained on room-scale scenes; do not use
  confidence: 0.5
  # null => derive from free VRAM via device.plan_dense_tile()
  tile_px: null
  overlap: 0.25
  max_matches_per_tile: 256

align:
  model: homography       # homography | affine | partial_affine
  threshold_px: 2.0       # first, permissive pass
  refine_threshold_px: 1.0  # second pass on inliers -- this is where sub-pixel comes from
  subpixel_window: 5

eval:
  uniformity_grid: 8
  gsd_m: null             # set to convert RMSE into ground metres

device:
  prefer_cuda: true
  precision: fp16         # fp32 costs ~2x VRAM and caps tiles at ~1216 px on 8 GB
