<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1A1F71" />
    <title>Chandralipi · Lunar image correspondence · SIH26166</title>
    <meta name="description" content="Chandralipi — multi-modal, sun-angle and scale invariant image correspondence for Chandrayaan-2 optical imagery. Smart India Hackathon 2026, ISRO. Team Severed Department, IIIT Bhubaneswar." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,600;125,700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Applied before first paint. Reading the preference from React instead
         flashes the light theme at anyone who asked for dark. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('chandralipi-theme')
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored)
          }
        } catch (error) { /* storage unavailable; fall through to the media query */ }
        document.documentElement.style.setProperty(
          '--topo-src', "url('./textures/lunar-contours.svg')"
        )
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
