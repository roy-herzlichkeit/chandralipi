[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lunar-reg"
version = "0.1.0"
description = "Multi-modal, sun-angle and scale invariant image correspondence for Chandrayaan-2 optical imagery (SIH26166)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Severed Department", email = "roy.herzlichkeit@gmail.com" }]
keywords = ["image-registration", "chandrayaan-2", "ohrc", "tmc-2", "iirs", "lunar", "remote-sensing"]

dependencies = [
    # --- requested core ---
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "rasterio>=1.3",          # windowed GDAL reads; the only thing that makes OHRC strips tractable
    # PINNED <5 DELIBERATELY. OpenCV 5 removed AKAZE, KAZE and BRISK from the
    # main module, and opencv-contrib-python 5.0.0 does NOT restore them
    # (verified). AKAZE is one of the benchmark paper's four classical
    # baselines, so it is not optional here. Verified working on 4.14.0:
    # SIFT, AKAZE, KAZE, BRISK, ORB, and ASIFT via AffineFeature.
    # Cost of the pin: OpenCV 5's native ALIKED/DISK/LightGlue wrappers, which
    # need external ONNX weights anyway and are covered by kornia.
    "opencv-python>=4.9,<5",
    "kornia>=0.7.2",          # LoFTR + DISK/LightGlue weights, differentiable warps
    "pygeodesy>=24.0",        # footprint geodesy -- MUST be driven with the lunar datum, see constants.py
    "pandas>=2.1",            # product manifest
    "pyarrow>=15.0",          # parquet backend for the manifest
    # --- pulled in transitively but pinned deliberately ---
    "torch>=2.2",             # kornia's backend; install the CUDA build explicitly (see README)
    # --- supporting ---
    "matplotlib>=3.8",        # viz/
    "PyYAML>=6.0",            # configs/
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]
# Optional on purpose: the dashboard is a viewer, and the pipeline, metrics and
# tests must stay installable and runnable on a machine that will never render
# it -- a headless node running a batch, for instance.
dashboard = ["streamlit>=1.30"]
notebooks = ["jupyterlab>=4.0", "ipywidgets>=8.1"]

[project.scripts]
lunar-reg = "lunar_reg.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lunar_reg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "gpu: requires a working CUDA device",
    "data: requires real PDS4 products under data/raw",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
packages = ["lunar_reg"]
ignore_missing_imports = true
